name: Scheduled Question Source Sync (Free-Tier Offload)

on:
  schedule:
    # Offloads heavy 12h YesPrava/ProPDD HTML diffing from Render free tier (512 MB RAM)
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  trigger-question-sync:
    name: Trigger Authenticated Staging Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Render Sync Webhook
        env:
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          if [ -z "$SYNC_WEBHOOK_SECRET" ]; then
            echo "ℹ️ SYNC_WEBHOOK_SECRET secret is not set yet; skipping external trigger cleanly."
            exit 0
          fi
          BASE_URL="${RENDER_APP_URL:-https://rully-app.onrender.com}"
          ENDPOINT="${BASE_URL%/}/api/admin/questions/sync/webhook?auto_stage=true"
          echo "Triggering question sync check on $ENDPOINT ..."
          HTTP_CODE=$(curl -s -o sync_result.json -w "%{http_code}" -X POST \
            -H "X-Sync-Secret: ${SYNC_WEBHOOK_SECRET}" \
            "$ENDPOINT")
          echo "HTTP Status: $HTTP_CODE"
          cat sync_result.json || true
          echo ""
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Sync webhook returned HTTP $HTTP_CODE"
            exit 1
          fi
