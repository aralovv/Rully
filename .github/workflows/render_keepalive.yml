name: Render 24/7 Keepalive & Health Watchdog

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    name: Keep Render Awake (Ping Health Endpoint)
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render.com API & MTProto Service
        run: |
          echo "Pinging https://rully-app.onrender.com/api/health ..."
          HTTP_RESPONSE=$(curl -s -o response.json -w "%{http_code}" https://rully-app.onrender.com/api/health)
          echo "HTTP Status Code: $HTTP_RESPONSE"
          cat response.json || true
          echo ""
          if [ "$HTTP_RESPONSE" -eq 200 ]; then
            echo "✅ Render service is active, awake, and healthy!"
          else
            echo "⚠️ Warning: Status code $HTTP_RESPONSE received."
          fi
