services:
  - type: web
    name: rully-all-in-one
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: python run_server.py
    envVars:
      - key: TURSO_DATABASE_URL
        value: https://rully-aralovv.aws-ap-south-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: ORDERS_GROUP_CHAT_ID
        sync: false
      - key: ADMIN_USERNAME
        value: Admin
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: WEB_APP_URL
        value: https://rully-app.onrender.com
      - key: ENABLE_BOT_POLLING
        value: "true"
